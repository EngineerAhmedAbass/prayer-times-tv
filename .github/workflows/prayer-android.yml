name: Prayer TV APK

on:
  push:
    branches: ['main']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prayer-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # لو مفيش ملف أذان في res/raw بنجيب تسجيل برخصة حرة من Wikimedia Commons
      - name: Get adhan audio
        run: python3 tools/fetch_adhan.py android/app/src/main/res/raw || true

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Prayer-TV.apk
          # زرار التحديث في البرنامج بيقرا رقم آخر نسخة من هنا
          V=$(( ${{ github.run_number }} + 100 ))
          echo "{\"versionCode\": $V, \"versionName\": \"1.0.$V\"}" > version.json

      - uses: actions/upload-artifact@v4
        with:
          name: Prayer-TV-apk
          path: Prayer-TV.apk

      # رابط ثابت لآخر نسخة: releases/latest/download/Prayer-TV.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(( ${{ github.run_number }} + 100 ))
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Prayer-TV.apk version.json \
            --target "${{ github.sha }}" \
            --latest \
            --title "مواقيت الصلاة للتليفزيون (نسخة $V)" \
            --notes "نزّل Prayer-TV.apk وسطّبه على التليفزيون (Android TV) أو الموبايل. افتحه مرة واختار مدينتك وهو هيأذن لوحده في كل صلاة."
