name: Transcribe adhan (one-off)

# مؤقت: بيكتب كلام الأذان المكي بالتوقيت عشان نعرف مكان "الصلاة خير من النوم"
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/transcribe.yml']

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q openai-whisper
      - name: Transcribe
        run: |
          cat > t.py <<'PY'
          import whisper
          m = whisper.load_model("medium")
          r = m.transcribe("android/app/src/main/res/raw/adhan_makkah.mp3", language="ar",
                           word_timestamps=True, condition_on_previous_text=False)
          with open("makkah.txt", "w", encoding="utf-8") as f:
              for s in r["segments"]:
                  f.write(f"{s['start']:7.1f} {s['end']:7.1f}  {s['text']}\n")
                  for w in s.get("words", []):
                      f.write(f"      {w['start']:7.1f} {w['end']:7.1f}  {w['word']}\n")
          PY
          python3 t.py
          cat makkah.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete transcript --yes --cleanup-tag || true
          gh release create transcript makkah.txt --prerelease --latest=false --title "transcript" --notes "مؤقت"
