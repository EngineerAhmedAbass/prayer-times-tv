name: Prayer TV UI check

# بيشغّل التطبيق على محاكي أندرويد ويصوّر الشاشات ويتأكد إنه مابيقفلش.
on:
  push:
    branches: ['main', 'ccr-239bb624-zdnjjm']
    paths: ['prayer/**', '.github/workflows/prayer-ui-check.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prayer-ui-check
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p prayer/android assembleRelease --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash prayer/tools/ui_check.sh prayer/android/app/build/outputs/apk/release/app-release.apk

      # الصور على رابط ثابت: releases/download/prayer-ui-check/<اسم الصورة>
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls ui-shots || exit 0
          gh release delete prayer-ui-check --yes --cleanup-tag || true
          gh release create prayer-ui-check ui-shots/*.png ui-shots/logcat.txt \
            --target "${{ github.sha }}" --prerelease --latest=false \
            --title "Prayer TV UI check (run ${{ github.run_number }})" \
            --notes "صور من تشغيل التطبيق على المحاكي."
